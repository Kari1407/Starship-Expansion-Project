		#LOC_SEP_switcher_AerocoverFWD_ShieldedUnpainted_detail = Ce carénage non peint aide à protéger les charnières et actionneurs sensibles des ailerons.
		#LOC_SEP_switcher_AerocoverFWD_ShieldedPainted = Couvert peint
		#LOC_SEP_switcher_AerocoverFWD_ShieldedPainted_detail = Ce carénage peint aide à protéger les charnières et actionneurs sensibles des ailerons.
		#LOC_SEP_switcher_AerocoverFWD_Exposed = Exposé
		#LOC_SEP_switcher_AerocoverFWD_Exposed_detail = Les charnières et les actionneurs des ailerons sont apparents sur le dos du véhicule.

