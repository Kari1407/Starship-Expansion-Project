		#LOC_SEP_switcher_RadioAntenna_HexNose = Antennes du nez
		#LOC_SEP_switcher_RadioAntenna_HexNose_detail = Ces antennes installées sur le nez transmettent des données au contrôle de mission. Elles permettent aussi de remplir le nez de choses à regarder !
		#LOC_SEP_switcher_RadioAntenna_Both = Les deux antennes
