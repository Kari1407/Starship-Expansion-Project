		#LOC_SEP_switcher_proto_body_description = Choix du véhicule
		#LOC_SEP_switcher_proto_body_sn15 = Haute altitude
		#LOC_SEP_switcher_proto_body_sn15_detail = Ce prototype à échelle réelle est conçu pour tester les moteurs en vol, la manœuvre "belly flop" et l'atterrissage. Possède des nœuds pour attacher des ailerons et un nez.
		#LOC_SEP_switcher_proto_body_sn5 = Basse altitude
		#LOC_SEP_switcher_proto_body_sn5_detail = Ce prototype à échelle réelle est conçu pour des sauts à basse altitude.
		#LOC_SEP_switcher_proto_body_sn5_mass = Basse altitude avec simulateur de masse
		#LOC_SEP_switcher_proto_body_sn5_mass_detail = Ce prototype à échelle réelle est conçu pour des sauts à basse altitude. Le simulateur de masse au-dessus du véhicule aide à réduire le rapport poussée : poids.
		#LOC_SEP_switcher_proto_body_bare_detail = Ce prototype à échelle réelle n'a aucune capacité de vol. Il peut cependant quand même le faire.

		#LOC_SEP_switcher_GapFiller_description = Choix du remplissage entre tuiles
		#LOC_SEP_switcher_GapFiller_enabled_detail = Cette substance pour remplir les vides est appliquée aux vides entre les tuiles hexagonales qui servent de bouclier thermique et permet de réduire les points de défaillance sur le bouclier thermique.
		#LOC_SEP_switcher_GapFiller_disabled_detail = Sans remplissage pour combler les vides, des interstices un peu trop larges sur le bouclier thermique laisseraient la chaleur de la rentrée atteindre plus vite l'acier sensible du Ship.

		#LOC_SEP_switcher_StaticWicks_description = Choix des déchargeurs statiques
		#LOC_SEP_switcher_StaticWicks_enabled_detail = Ces déchargeurs statiques dissipent l'électricité accumulée sur les ailerons pour prévenir les défaillances.
		#LOC_SEP_switcher_StaticWicks_disabled_detail = Sans les déchargeurs statiques, les ailerons sont exposés à une accumulation d'énergie statique.

		#LOC_SEP_switcher_AerocoverFWD_description = Choix du carénage aérodynamique
