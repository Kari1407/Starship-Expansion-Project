		#LOC_SEP_switcher_raceway_24 = Basique
		#LOC_SEP_switcher_raceway_24_detail = Ce raceway basique contient le matériel minimum pour que le véhicule fonctionne. Il lui manque aussi un système de destruction en vol. Utilisez avec vigilance.
		#LOC_SEP_switcher_raceway_25 = Basique FTS
		#LOC_SEP_switcher_raceway_25_detail = Raceway basique mais modifié pour adopter des charges de destruction en plus, pour que vous puissiez terminer le vol si nécessaire.
		#LOC_SEP_switcher_raceway_26 = Repensé
		#LOC_SEP_switcher_raceway_26_detail = Après s'être rendu compte des problèmes du raceway original, il a finalement été redessiné pour mieux supporter les charges de destruction et améliorer l'aérodynamique. De plus, il a l'air plus classe.

		#LOC_SEP_switcher_engineshield_description = Bouclier de la baie de moteurs
		#LOC_SEP_switcher_engineshield_shielded = Couvert
		#LOC_SEP_switcher_engineshield_shielded_detail = La section arrière du véhicule est protégée de l'énergie de la séparation à chaud. Censé être combiné avec des moteurs qui sont couverts.
		#LOC_SEP_switcher_engineshield_unshielded = Exposé
		#LOC_SEP_switcher_engineshield_unshielded_detail = La section arrière du vaisseau est exposée, ce qui rend les équipements sensibles vulnérables aux dommages.

		#LOC_SEP_switcher_skirtcuts_description = Découpes de purge de la jupe
		#LOC_SEP_switcher_skirtcuts_cut_detail = Ces découpes aident à purger l'excès de gaz qui serait sinon coincé au-dessus du faux plafond créé par la protection de la jupe.
		#LOC_SEP_switcher_skirtcuts_full_detail = Sans les découpes, il est impossible d'évacuer les gaz de la jupe une fois la protection installée. Utilisez avec vigilance.

		#LOC_SEP_switcher_hpu_description = Groupe hydraulique
		#LOC_SEP_switcher_hpu_on_detail = Ce groupe hydraulique fournit l'énergie nécessaire au TVC hydraulique des moteurs centraux. Un petit souci, les moteurs utilisent un TVC électrique, mais vous pouvez le garder si vous le souhaitez. Livré avec une protection supplémentaire.
		#LOC_SEP_switcher_hpu_off_detail = De toute façon, vous n'en aurez pas besoin, donc autant se débarrasser du poids en trop.

