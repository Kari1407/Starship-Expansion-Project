		#LOC_SEP_switcher_RadioAntenna_None = Aucune antenne
		#LOC_SEP_switcher_RadioAntenna_None_detail = Vous avez décidé de transmettre les données de manière différente. Pas d'antennes installées sur le nez.

		#LOC_SEP_switcher_StarlinkAntenna_description = Antennes Starlink
