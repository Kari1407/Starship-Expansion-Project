		#LOC_SEP_switcher_Hoppy_Nose_nosecone = Installé
		#LOC_SEP_switcher_Hoppy_Nose_nosecone_detail = Malgré la perte du nez original, un autre nez a été soudé sur le dessus du Hopper.

