		//Prototypes

		#LOC_SEP_24_HOPPY_title = Hopper Donnager Suborbital
		#LOC_SEP_24_HOPPY_description = Le Hopper Suborbital Donnager était le premier prototype à avoir volé, marquant une étape importante quant à la viabilité de la série de vaisseaux Donnager. Conçu pour des vols à basse altitude, ce prototype a réussi un saut de 150 mètres pour valider les mécaniques de base en vol. Malgré son poids élevé et le manque de systèmes avancés de contrôle d'attitude, le Hopper a servi de tremplin essentiel avant de passer aux prototypes suivants, plus avancés. Le nez aérodynamique est optionnel pour cette version, et cette version accepte jusqu'à trois moteurs.
		#LOC_SEP_24_HOPPY_tags = BFR ITS big BFS ship starship engine landing spacex starhopper hoppy hopper moteur atterrissage prototype saut

		#LOC_SEP_24_SHIP_PROTO_AFT_LEFT_title = Aileron arrière gauche Donnager Suborbital
		#LOC_SEP_24_SHIP_PROTO_AFT_LEFT_description = L'aileron arrière gauche Suborbital fait partie du système de contrôle aérodynamique du Donnager, conçu pour les vols d'essai à haute altitude. Cet aileron utilise la traînée pour aider à diriger le vaisseau pendant le vol atmosphérique et joue un rôle critique dans la stabilisation du véhicule. Il n'a pas été conçu pour supporter les conditions de la rentrée atmosphérique.
		#LOC_SEP_24_SHIP_PROTO_AFT_LEFT_tags = starship bfr its spacex ship spaceship wing flap aft sn15 sn8 sn9 sn10 sn11 aile aileron arrière vaisseau

		#LOC_SEP_24_SHIP_PROTO_AFT_RIGHT_title = Aileron arrière droit Donnager Suborbital
		#LOC_SEP_24_SHIP_PROTO_AFT_RIGHT_description = L'aileron arrière droit Suborbital remplit le même rôle que l'aileron gauche, en utilisant la traînée pour aider à diriger le vaisseau pendant les vols d'essai à haute altitude. Comme l'aileron gauche, il est essentiel à la stabilité en vol, mais il n'a pas été conçu pour les conditions extrêmes de la rentrée atmosphérique.
		#LOC_SEP_24_SHIP_PROTO_AFT_RIGHT_tags = starship bfr its spacex ship spaceship wing flap aft sn15 sn8 sn9 sn10 sn11 aile aileron arrière vaisseau

		#LOC_SEP_24_SHIP_PROTO_BODY_title = Corps principal Donnager Suborbital
		#LOC_SEP_24_SHIP_PROTO_BODY_description = Après le succès du Hopper, le corps principal Donnager Suborbital a été créé pour des essais à échelle réelle. Ce corps contient tout le matériel nécessaire aux vols d'essai à basse comme à haute altitude, et aide à affiner les performances du Donnager en conditions réelles.
		#LOC_SEP_24_SHIP_PROTO_BODY_tags = BFR ITS big BFS ship starship 2021 ift flight test spacex core sn15 sn8 sn9 sn10 sn11 corps principal vol essai test

		#LOC_SEP_24_SHIP_PROTO_FWD_LEFT_title = Aileron avant gauche Donnager Suborbital
		#LOC_SEP_24_SHIP_PROTO_FWD_LEFT_description = L'aileron avant gauche Donnager Suborbital fait partie du système de contrôle aérodynamique du vaisseau, conçu pour les vols à haute altitude. Il utilise la traînée pour aider à diriger le vaisseau et joue un rôle essentiel dans la stabilisation du véhicule en conditions atmosphériques. Comme tous les autres ailerons, il n'a pas été prévu pour les contraintes de la rentrée atmosphérique.
		#LOC_SEP_24_SHIP_PROTO_FWD_LEFT_tags = starship bfr its spacex ship spaceship wing flap fwd sn15 sn8 sn9 sn10 sn11 aile aileron avant vaisseau

		#LOC_SEP_24_SHIP_PROTO_FWD_RIGHT_title = Aileron avant droit Donnager Suborbital
		#LOC_SEP_24_SHIP_PROTO_FWD_RIGHT_description = L'aileron avant droit Donnager Suborbital remplit le même rôle que l'aileron avant gauche, en utilisant la traînée pour aider à diriger le vaisseau pendant les vols à haute altitude. Cet aileron joue un rôle clé dans la stabilité et le contrôle pendant le vol atmosphérique, mais il n'est pas conçu pour supporter les contraintes de la rentrée atmosphérique.
		#LOC_SEP_24_SHIP_PROTO_FWD_RIGHT_tags = starship bfr its spacex ship spaceship wing flap fwd sn15 sn8 sn9 sn10 sn11 aile aileron avant vaisseau

		#LOC_SEP_24_SHIP_PROTO_NOSE_title = Module de nez Donnager Suborbital
		#LOC_SEP_24_SHIP_PROTO_NOSE_description = Le module de nez Donnager Suborbital est conçu pour les vols d'essai à haute altitude. Il fournit des points d'accroche pour les ailerons avant et contient un réservoir de carburant spécial destiné aux opérations d'atterrissage. Ce nez n'est pas conçu pour supporter la chaleur générée pendant la rentrée atmosphérique.
		#LOC_SEP_24_SHIP_PROTO_NOSE_tags = BFR ITS big BFS ship starship 2021 ift flight test spacex nosecone sn15 sn8 sn9 sn10 sn11 nez vol essai test


		//BL-1

		#LOC_SEP_24_SHIP_AFT_LEFT_title = Aileron arrière gauche Donnager BL-1
		#LOC_SEP_24_SHIP_AFT_LEFT_description = L'aileron arrière gauche BL-1 est un peu plus petit que les versions Suborbital et il est conçu pour la rentrée atmosphérique. En contrôlant la quantité de traînée produite, l'aileron aide à diriger le véhicule à travers l'atmosphère. Il est situé en bas à gauche du véhicule.
		#LOC_SEP_24_SHIP_AFT_LEFT_tags = starship bfr its spacex ship spaceship wing flap aft aile aileron arrière vaisseau

		#LOC_SEP_24_SHIP_AFT_RIGHT_title = Aileron arrière droit Donnager BL-1
		#LOC_SEP_24_SHIP_AFT_RIGHT_description = L'aileron arrière droit BL-1 est un peu plus petit que les versions Suborbital et il est conçu pour la rentrée atmosphérique. En contrôlant la quantité de traînée produite, l'aileron aide à diriger le véhicule à travers l'atmosphère. Il est situé en bas à droite du véhicule.
		#LOC_SEP_24_SHIP_AFT_RIGHT_tags = starship bfr its spacex ship spaceship wing flap aft aile aileron arrière vaisseau

		#LOC_SEP_24_SHIP_CARGO_title = Module cargo Donnager BL-1
		#LOC_SEP_24_SHIP_CARGO_description = Le module cargo Donnager BL-1 est conçu pour transporter des charges utiles et offre un espace polyvalent pour une grande variété de missions. Il s'intègre parfaitement au véhicule Donnager et permet un transport efficace de cargaison, tout en supportant la rentrée atmosphérique et l'atterrissage.
		#LOC_SEP_24_SHIP_CARGO_tags = BFR ITS big BFS ship starship landing Cargo spacex atterrissage cargo soute module

		#LOC_SEP_24_SHIP_CORE_title = Corps principal Donnager BL-1
		#LOC_SEP_24_SHIP_CORE_description = Le corps principal Donnager BL-1 est conçu pour les vols orbitaux et la rentrée atmosphérique. Il contient tous les systèmes essentiels aux missions spatiales.
		#LOC_SEP_24_SHIP_CORE_tags = BFR ITS big BFS ship starship landing spacex core atterrissage corps principal

		#LOC_SEP_24_SHIP_FWD_LEFT_title = Aileron avant gauche Donnager BL-1
		#LOC_SEP_24_SHIP_FWD_LEFT_description = L'aileron avant gauche BL-1 est un peu plus petit que les versions Suborbital et il est conçu pour la rentrée atmosphérique. En contrôlant la quantité de traînée produite, l'aileron aide à diriger le véhicule à travers l'atmosphère. Il est situé en haut à gauche du véhicule.
		#LOC_SEP_24_SHIP_FWD_LEFT_tags = starship bfr its spacex ship spaceship wing flap fwd aile aileron avant vaisseau

		#LOC_SEP_24_SHIP_FWD_RIGHT_title = Aileron avant droit Donnager BL-1
		#LOC_SEP_24_SHIP_FWD_RIGHT_description = L'aileron avant droit BL-1 est un peu plus petit que les versions Suborbital et il est conçu pour la rentrée atmosphérique. En contrôlant la quantité de traînée produite, l'aileron aide à diriger le véhicule à travers l'atmosphère. Il est situé en haut à droite du véhicule.
		#LOC_SEP_24_SHIP_FWD_RIGHT_tags = starship bfr its spacex ship spaceship wing flap fwd aile aileron avant vaisseau

		#LOC_SEP_24_SHIP_HEADER_title = Réservoir de tête Donnager BL-1
		#LOC_SEP_24_SHIP_HEADER_description = Un réservoir spécialement conçu contenant les carburants d'atterrissage du Donnager. Il contient à la fois du carburant et de l'oxydant, prévus spécialement pour l'allumage d'atterrissage. Pensez à le garder verrouillé jusqu'à ce que vous en ayez besoin !
		#LOC_SEP_24_SHIP_HEADER_tags = BFR ITS big BFS ship starship landing header tank fuel spacex atterrissage réservoir tête carburant

		#LOC_SEP_24_SHIP_NOSECONE_title = Module de nez Donnager BL-1
		#LOC_SEP_24_SHIP_NOSECONE_description = Un nez basique avec le strict minimum de matériel pour le Donnager. Il ne transporte ni carburant ni charge utile, ce qui le rend idéal pour les premiers vols de test intégrés, mais inutile pour les autres missions.
		#LOC_SEP_24_SHIP_NOSECONE_tags = BFR ITS big BFS ship starship landing spacex atterrissage nez

		#LOC_SEP_24_SHIP_PEZ_title = Module Pez Donnager BL-1
		#LOC_SEP_24_SHIP_PEZ_description = Une combinaison parfaite de réutilisabilité, de capacité de charge utile et de volume fait du module Pez l'outil idéal pour déployer de grandes constellations de satellites.
		#LOC_SEP_24_SHIP_PEZ_tags = BFR ITS big BFS ship starship landing spacex pez dispenser starlink atterrissage pez distributeur satellites


		#LOC_SEP_25_BOOSTER_CLUSTER_title = Cluster de moteurs "Andrada" Behemoth BL-1
		#LOC_SEP_25_BOOSTER_CLUSTER_description = Le cluster de moteurs "Andrada" Behemoth BL-1 regroupe jusqu'à 33 moteurs dans une configuration entièrement assemblée et fournit la poussée nécessaire aux missions de lancement lourd.
		#LOC_SEP_25_BOOSTER_CLUSTER_tags = BFR ITS big BFS ship starship 2025 landing spacex booster superheavy heavy super starship atterrissage booster moteurs cluster lourd

        #LOC_SEP_25_BOOSTER_GRIDFIN_title = Grid fin Behemoth BL-1
        #LOC_SEP_25_BOOSTER_GRIDFIN_description = Ces grid fins aérodynamiques, à peu près de la taille d'une voiture, sont conçues pour diriger le Behemoth à travers l'atmosphère. ATTENTION : PAS POUR L'ATTRAPAGE !
        #LOC_SEP_25_BOOSTER_GRIDFIN_tags = gridfin fin methane starship BFR ITS big BFS ship starship 2021 landing spacex booster superheavy heavy super grid interstage grille ailette méthane atterrissage booster interétage

		#LOC_SEP_25_BOOSTER_HSR_title = Anneau de séparation à chaud Behemoth BL-1
        #LOC_SEP_25_BOOSTER_HSR_description = L'anneau de séparation à chaud Behemoth BL-1 permet au Donnager d'allumer ses moteurs sans perdre d'élan lors de la séparation des étages. Il permet aussi au Behemoth de se retourner rapidement pour être récupéré sur le site de lancement, en gardant quelques moteurs allumés.
        #LOC_SEP_25_BOOSTER_HSR_tags = BFR ITS big BFS ship starship landing spacex hotstage ring decoupler separator superheavy super heavy booster anneau séparation chaud étages découpleur atterrissage

		#LOC_SEP_25_BOOSTER_CORE_title = Corps central Behemoth BL-1
		#LOC_SEP_25_BOOSTER_CORE_description = Le corps central Behemoth BL-1 est l'élément structurel et fonctionnel central du Behemoth, il contient les réservoirs de carburant et les systèmes de contrôle essentiels des moteurs. Il alimente jusqu'à 33 moteurs et intègre des systèmes critiques qui contrôlent les performances des moteurs pendant le lancement, l'ascension et l'atterrissage.
        #LOC_SEP_25_BOOSTER_CORE_tags = BFR ITS big BFS ship starship 2021 landing spacex booster superheavy heavy super atterrissage booster corps central lourd


		//Expendable

		#LOC_SEP_24_SHIP_CORE_EXP_title = Corps principal non réutilisable Donnager BL-1
		#LOC_SEP_24_SHIP_CORE_EXP_description = Le corps principal non réutilisable Donnager BL-1 contient tous les systèmes essentiels aux missions spatiales et fournit l'infrastructure nécessaire pour emmener des charges utiles en orbite. Contrairement à la variante réutilisable, cette version est prévue pour des missions sans retour et n'a ni bouclier thermique ni surfaces de contrôle aérodynamique pour la rentrée atmosphérique.
		#LOC_SEP_24_SHIP_CORE_EXP_tags = BFR ITS big BFS ship starship spacex core expendable corps principal non réutilisable jetable

		#LOC_SEP_24_SHIP_CARGO_EXP_title = Module cargo non réutilisable Donnager BL-1
		#LOC_SEP_24_SHIP_CARGO_EXP_description = Le module cargo non réutilisable Donnager BL-1 est conçu pour les missions qui ne nécessitent pas de rentrée atmosphérique. Il offre de l'espace pour les charges utiles et s'intègre au véhicule pour livrer la cargaison en orbite, mais il lui manque les équipements nécessaires à la rentrée atmosphérique, comme les boucliers thermiques et les ailerons.
		#LOC_SEP_24_SHIP_CARGO_EXP_tags = BFR ITS big BFS ship starship landing Cargo spacex expendable atterrissage cargo soute non réutilisable jetable

		#LOC_SEP_24_SHIP_NOSECONE_EXP_title = Module de nez non réutilisable Donnager BL-1
		#LOC_SEP_24_SHIP_NOSECONE_EXP_description = Le module de nez non réutilisable Donnager BL-1 donne au véhicule la forme aérodynamique nécessaire pendant l'ascension et il est idéal pour les premiers vols de test intégrés. Il ne transporte aucune charge utile et n'a ni bouclier thermique ni surfaces de contrôle aérodynamique pour la rentrée atmosphérique. Ce module est conçu pour des missions sans retour.
		#LOC_SEP_24_SHIP_NOSECONE_EXP_tags = BFR ITS big BFS ship starship spacex expendable nez non réutilisable jetable

		#LOC_SEP_24_SHIP_PEZ_EXP_title = Module Pez non réutilisable Donnager BL-1
		#LOC_SEP_24_SHIP_PEZ_EXP_description = Le module Pez non réutilisable Donnager BL-1 est un module très efficace pour transporter des charges utiles en orbite, idéal pour déployer de grandes constellations de satellites. Sans bouclier thermique ni ailerons, ce module est conçu pour des missions sans retour qui ne nécessitent pas de rentrée atmosphérique.
		#LOC_SEP_24_SHIP_PEZ_EXP_tags = BFR ITS big BFS ship starship landing spacex pez dispenser starlink expendable atterrissage pez distributeur satellites non réutilisable jetable


