		#LOC_SEP_26_SHIP_CARGO_title = Donnager BL-3 货舱
		#LOC_SEP_26_SHIP_CARGO_description = Donnager 货舱用于搭载载荷，为各类任务提供灵活空间。它能无缝接入 Donnager 机体，在支持再入与着陆的同时高效运输货物。

