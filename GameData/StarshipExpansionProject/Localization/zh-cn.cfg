		#LOC_SEP_24_HOPPY_title = Donnager 亚轨道跳跃试验机
		#LOC_SEP_24_HOPPY_description = Donnager 亚轨道跳跃试验机是首个成功试飞的原型，是验证 Donnager 系列可行性的关键里程碑。它专为低空测试设计，成功完成 150 米跳跃，验证了基本飞行力学。虽然笨重且缺少先进姿态控制，但它是迈向更先进原型的重要垫脚石。此构型可选装头锥，最多可安装三台发动机。
		#LOC_SEP_24_HOPPY_tags = BFR ITS big BFS ship starship engine landing spacex starhopper hoppy hopper

		#LOC_SEP_24_SHIP_PROTO_AFT_LEFT_title = Donnager 亚轨道后左襟翼
		#LOC_SEP_24_SHIP_PROTO_AFT_LEFT_description = 亚轨道后左襟翼是 Donnager 气动控制系统的一部分，为高空试飞设计。它利用阻力协助飞行器在大气层内转向，对稳定机体至关重要。该襟翼并非为承受再入环境而设计。
		#LOC_SEP_24_SHIP_PROTO_AFT_LEFT_tags = starship bfr its spacex ship spaceship wing flap aft sn15 sn8 sn9 sn10 sn11

		#LOC_SEP_24_SHIP_PROTO_AFT_RIGHT_title = Donnager 亚轨道后右襟翼
		#LOC_SEP_24_SHIP_PROTO_AFT_RIGHT_description = 亚轨道后右襟翼与后左襟翼用途相同，在高空试飞中利用阻力协助转向。与左襟翼一样，它对飞行中的稳定性至关重要，但并非为再入的极端环境而设计。
		#LOC_SEP_24_SHIP_PROTO_AFT_RIGHT_tags = starship bfr its spacex ship spaceship wing flap aft sn15 sn8 sn9 sn10 sn11

		#LOC_SEP_24_SHIP_PROTO_BODY_title = Donnager 亚轨道主舱体
		#LOC_SEP_24_SHIP_PROTO_BODY_description = 在跳跃试验机成功后，Donnager 亚轨道主舱体被用于全尺寸测试。它容纳低空与高空试飞所需的全部硬件，帮助在真实条件下优化 Donnager 的性能。
