		#LOC_SEP_24_SHIP_PROTO_FWD_LEFT_description = Donnager 亚轨道前左襟翼是飞行器气动控制系统的一部分，为高空飞行设计。它利用阻力协助转向，在维持大气层内稳定性方面起关键作用。与其他襟翼一样，它并非为再入应力而设计。
