		#LOC_SEP_26_SHIP_NOSECONE_description = 基础头锥，只含 Donnager 最低限度的硬件。除着陆用头部储箱外不携带燃料，也不携带载荷，适合早期一体化试飞，但用于其他任务时意义不大。

