// ============================================================================
//  Dynamic-pressure based roll authority handover between the Super Heavy grid
//  fins and the Raptor TVC. See Source/Modules/ModuleSEPGridFinQHandover.cs
//
//  q   = 0.5 * rho * v^2                        (kPa)
//  w   = clamp01((q - qLow) / (qHigh - qLow))
//  fin = lerp(finLow,  finHigh, w)
//  eng = lerp(engHigh, engLow,  w)              (only if scaleEngineGimbal)
// ============================================================================

@PART[SEP_25_BOOSTER_GRIDFIN|SEP_26_BOOSTER_GRIDFIN]:FOR[StarshipExpansionProject]
{
    MODULE
    {
        name = ModuleSEPGridFinQHandover

        // Dynamic pressure thresholds, in kPa.
        qLow  = 10
        qHigh = 40

        // Grid fin authority limits, in percent.
        finLow  = 0
        finHigh = 100

        // Optional: also scale the Raptor gimbal authority.
        // Off by default, because ModuleGimbal.gimbalLimiter is not per-axis
        // and would also reduce pitch/yaw authority.
        scaleEngineGimbal = false
        engHigh = 100
        engLow  = 30

        // Keep the fins working on the roll axis only.
        rollOnly = true

        // Low-pass factor for the handover weight (0 = instant).
        smoothing = 0.15
    }
}
