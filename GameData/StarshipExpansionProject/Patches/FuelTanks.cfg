@PART[SEP_24_SHIP_PROTO_BODY|SEP_24_SHIP_PROTO_NOSE|SEP_24_HOPPY|SEP_24_SHIP_CORE|SEP_24_SHIP_CORE_EXP|SEP_25_BOOSTER_CORE|SEP_25_SHIP_CORE|SEP_25_SHIP_PEZ|SEP_25_SHIP_CARGO|SEP_24_SHIP_PEZ|SEP_24_SHIP_NOSECONE|SEP_24_SHIP_CARGO|SEP_26_BOOSTER_CORE|SEP_26_SHIP_CORE|SEP_26_SHIP_PEZ|SEP_26_SHIP_CARGO|SEP_26_SHIP_NOSECONE]:FOR[StarshipExpansionProject]
{
	MODULE:NEEDS[B9PartSwitch,!ModularFuelTanks,!RealFuels]
	{
		name = ModuleB9PartSwitch
		switchInFlight = False
		moduleID = SEP_Fuel
		switcherDescription = Fuel Switch
		baseVolume = 1

		SUBTYPE
		{
			name = SEPLMOX
			tankType = SEPLMOX
			title = Methalox
		}
	}
	MODULE:NEEDS[CryoTanks,!RealFuels,!RealismOverhaul]
	{
		name =  ModuleCryoTank
		CoolingEnabled = False
		BOILOFFCONFIG
		{
			FuelName = LqdMethane
			// in % per hr
			BoiloffRate = 0.005
			CoolingCost = 0.02
		}
	}
	MODULE:NEEDS[ModularFuelTanks|RealFuels]
	{
		name = ModuleFuelTanks
		volume = 1
		type = Default
	}
}


// Hoppy
@PART[SEP_24_HOPPY]:FOR[StarshipExpansionProject]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[SEP_Fuel]]
	{
		@baseVolume = 20320
	}
	@MODULE[ModuleFuelTanks]:NEEDS[ModularFuelTanks|RealFuels]
	{
		@volume = 20320
		@volume:NEEDS[RealFuels] *= 5
	}
}

